
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project and find root
        run: |
          mkdir -p /tmp/scooter-src
          unzip -o scooter_control.zip -d /tmp/scooter-src
          PROJECT_DIR=$(dirname "$(find /tmp/scooter-src -name pubspec.yaml -type f -print -quit)")
          if [ "$PROJECT_DIR" = "." ] || [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
            echo "Flutter project not found in ZIP"
            exit 1
          fi
          cp -a "$PROJECT_DIR"/. .

      - name: Create Android project
        run: flutter create --platforms=android,ios .

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"

      - name: Install dependencies
        run: flutter pub get
        
      - name: Fix file_picker Android SDK
        run: |
          FILE=$(find "$HOME/.pub-cache" -path '*/file_picker-*/android/build.gradle' -type f | head -n 1)

          if [ -z "$FILE" ]; then
            echo "file_picker build.gradle not found"
            exit 1
          fi

          echo "Patching: $FILE"

          sed -i -E \
            's/(compileSdkVersion[[:space:]]+)[0-9]+/\1 36/; s/(compileSdk[[:space:]]*=[[:space:]]*)[0-9]+/\1 36/' \
            "$FILE"

          grep -n -E 'compileSdk' "$FILE"


      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scooter-control-apk
          path: build/app/outputs/flutter-apk/app-release.apk

