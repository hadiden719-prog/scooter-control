
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project and find root
        run: |
          mkdir -p /tmp/scooter-src
          unzip -o scooter_control.zip -d /tmp/scooter-src
          PROJECT_DIR=$(dirname "$(find /tmp/scooter-src -name pubspec.yaml -type f -print -quit)")
          if [ "$PROJECT_DIR" = "." ] || [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
            echo "Flutter project not found in ZIP"
            exit 1
          fi
          cp -a "$PROJECT_DIR"/. .

      - name: Create Android project
        run: flutter create --platforms=android,ios .

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"

      - name: Install dependencies
        run: flutter pub get

      - name: Set compile SDK 36 for all Android modules
        run: |
          find "$HOME/.pub-cache" \( -name build.gradle -o -name build.gradle.kts \) -type f | while read file; do
            if grep -q "flutter.compileSdkVersion" "$file"; then
              sed -i 's/flutter.compileSdkVersion/36/g' "$file"
            fi
          done

          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle.kts
          fi

          if [ -f android/app/build.gradle ]; then
            sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scooter-control-apk
          path: build/app/outputs/flutter-apk/app-release.apk

